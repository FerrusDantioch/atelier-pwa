name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests-unitaires:
    name: Tests sans navigateur (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lancer les tests
        run: node --test "tests/*.test.mjs"
